## =============================================
## Application Configuration
## =============================================
spring.application.name=paydayloan-backend
server.port=8081
server.servlet.context-path=/api

## =============================================
## Oracle Database Configuration
## =============================================
#spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:DEV_77}
spring.datasource.url=jdbc:oracle:thin:@192.168.20.77:1521/microcubepdb
spring.datasource.username=${DB_USERNAME:payday}
spring.datasource.password=${DB_PASSWORD:payday}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

## Oracle Connection Pool (UCP)
spring.datasource.oracleucp.initial-pool-size=5
spring.datasource.oracleucp.min-pool-size=5
spring.datasource.oracleucp.max-pool-size=20
spring.datasource.oracleucp.connection-wait-timeout=30

## =============================================
## JPA / Hibernate Configuration
## =============================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

## =============================================
## Logging Configuration
## =============================================
logging.level.root=INFO
logging.level.com.paydayloan=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.oracle.jdbc=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

## =============================================
## Jackson Configuration
## =============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

## =============================================
## Swagger UI
## =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
